<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Income Tracker Calendar</title>
    <!-- Include jQuery Library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js Annotation Plugin for Budget Line -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica', Arial, sans-serif;
            background-color: #f5f6fa;
            color: #2f3640;
            height: 100%;
            width: 100%;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* Desktop view style */
        @media (min-width: 768px) {
            .container {
                flex-direction: row;
                height: 100vh;
                overflow: hidden;
            }
            .form-area {
                width: 320px;
                height: 100%;
                overflow-y: auto;
            }
            .content-area {
                flex: 1;
                height: 100%;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .calendar-area {
                flex: 1;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .calendar-body {
                flex: 1;
                position: relative;
            }
            #fullDiv {
                position: absolute;
                left: 0; top: 0; bottom: 0; right: 0;
            }
            ul#calendarGrid {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                grid-template-rows: 40px repeat(6, 1fr); /* For calendar grid's design */
                height: 100%;
                width: 100%;
            }
            li {
                width: 100% !important;
                height: 100% !important;
            }
        }

        /* mobile view style */
        @media (max-width: 767px) {
            html, body {
                height: auto;
                overflow-y: auto;
            }
            .container {
                height: auto;
            }
            .form-area {
                width: 100%;
            }
            .content-area {
                width: 100%;
                display: block;
            }
            .calendar-body {
                width: 100%;
                overflow-x: hidden; 
            }
            #fullDiv {
                position: relative;
                width: 100%;
            }
            ul#calendarGrid {
                display: grid;
                grid-template-columns: repeat(7, 1fr); 
                width: 100%;
            }
            li {
                width: 100% !important;
                height: 75px !important; 
            }
            .expense-display {
                font-size: 9px !important; 
                bottom: 4px !important;
                left: 4px !important;
                right: 4px !important;
            }
            .date-num {
                top: 4px !important;
                left: 4px !important;
                font-size: 12px !important;
            }
        }

        /* Form Area Sidebar */
        .form-area {
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }

        .form-area h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            color: #1abc9c;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #dcdde1;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #1abc9c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Calendar Area Container */
        .calendar-area {
            background-color: #ffffff;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #f1f2f6;
        }

        .calendar-header h3 {
            margin: 0;
            font-size: 22px;
            color: #2f3640;
        }

        .nav-btn {
            background-color: #1abc9c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .nav-btn:hover {
            background-color: #16a085;
        }

        ul {
            margin: 0;
            padding: 0;
            list-style-type: none;
        }

        li {
            position: relative;
            border: 1px solid #f1f2f6;
        }

        .day-title {
            font-weight: 900;
            color: #e67e22;
            background-color: #fff5e6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .not-current-month {
            font-weight: 900;
            color: rgba(0,0,0,.2);
            background-color: #fafbfc;
        }

        .current-month-day {
            background-color: #ffffff;
        }

        li:not(.day-title) {
            cursor: pointer;
        }

        li:hover:not(.day-title) {
            border-radius: 5px;
            background-color: #e8f8f5;
        }

        .date-num {
            position: absolute;
            top: 8px;
            left: 8px;
            font-weight: bold;
            font-size: 14px;
            line-height: 1;
        }

        .expense-display {
            position: absolute;
            bottom: 8px;
            right: 8px;
            left: 8px;
            font-weight: bold;
            font-size: 11px;
            text-align: right;
            line-height: 1.3;
            word-break: break-all; 
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .income-text { color: #2ecc71; }
        .expense-text { color: #e74c3c; }

        /* ==================== CLEAN LIST TABULAR MODAL ==================== */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(47, 54, 64, 0.6);
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: #fff;
            padding: 35px;
            border-radius: 12px;
            width: 95%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 28px;
            cursor: pointer;
            color: #a0a8b3;
        }

        .close-btn:hover { color: #2f3640; }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
            color: #2f3640;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 12px;
        }

        .list-wrapper {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
        }

        .table-header, .transaction-row {
            display: grid;
            grid-template-columns: 140px 1fr 120px 140px;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
        }

        .table-header {
            background-color: #f8f9fa;
            font-weight: bold;
            font-size: 13px;
            color: #7f8c8d;
            border-bottom: 2px solid #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .transaction-row {
            border-bottom: 1px solid #edf2f7;
            background-color: #ffffff;
            transition: background-color 0.15s;
        }

        .transaction-row:last-child {
            border-bottom: none;
        }

        .transaction-row:hover {
            background-color: #fafbfc;
        }

        .type-badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
        }
        .badge-inc { background-color: #e8f8f5; color: #2ecc71; }
        .badge-exp { background-color: #fde8e8; color: #e74c3c; }

        .row-cat {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 2px;
        }

        .row-memo {
            font-size: 14px;
            color: #2f3640;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .row-amount {
            font-size: 15px;
            font-weight: bold;
            text-align: right;
        }

        .row-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .action-btn {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .edit-btn { background-color: #edf2f7; color: #4a5568; }
        .edit-btn:hover { background-color: #e2e8f0; }
        .delete-btn { background-color: #fee2e2; color: #ef4444; }
        .delete-btn:hover { background-color: #fca5a5; }
        .save-btn { background-color: #1abc9c; color: white; }
        .cancel-btn { background-color: #cbd5e1; color: #475569; }

        .edit-input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }
        .edit-input:focus { border-color: #1abc9c; }

        .no-data {
            color: #7f8c8d;
            text-align: center;
            padding: 40px 20px;
            font-style: italic;
            background-color: #ffffff;
        }

        .balance-card {
            background: linear-gradient(135deg, #1abc9c, #16a085);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(26, 188, 156, 0.2);
        }

        .balance-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .balance-value {
            font-size: 26px;
            font-weight: bold;
            word-wrap: break-word;
        }
        
    </style>
</head>
<body>

<div class="container">
    <!-- Left Input Sidebar -->
    <div class="form-area">
        <div class="balance-card">
            <div class="balance-label">Total Balance</div>
            <div class="balance-value" id="totalBalanceDisplay">$0</div>
        </div>

        <h2>Add Transaction</h2>
        <form id="expenseForm">
            <div class="form-group">
                <label for="expenseDate">Date</label>
                <input type="date" id="expenseDate" required>
            </div>
            
            <div class="form-group">
                <label for="expenseAmount">Amount ($)</label>
                <input type="number" id="expenseAmount" min="0.01" step="0.01" placeholder="0.00" required>
            </div>
            
            <div class="form-group">
                <label for="expenseCategory">Category</label>
                <select id="expenseCategory" required>
                    <option value="" disabled selected>Select category</option>
                    <option value="book">book</option>
                    <option value="culture">culture</option>
                    <option value="eat out">eat out</option>
                    <option value="fee">fee</option>
                    <option value="fun">fun</option>
                    <option value="grocery">grocery</option>
                    <option value="health">health</option>
                    <option value="luck">luck</option>
                    <option value="necesito">necesito</option>
                    <option value="utility">utility</option>
                    <option value="transport">transport</option>
                    <option value="church">church</option>
                    <option value="family">family</option>
                    <option value="uncommon expense">uncommon expense</option>
                    <option value="rent">rent</option>
                    <option value="salary">salary</option>
                    <option value="other income">other income</option>
                    <option value="etc.">etc.</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="expenseMemo">Memo / Description</label>
                <input type="text" id="expenseMemo" placeholder="E.g., Grocery shopping">
            </div>
            
            <button type="submit" class="btn-submit">Add to Calendar</button>
        </form>
    </div>

    <!-- Right Side Content Wrapper (Chart + Calendar) -->
    <div class="content-area">
        <!-- Chart Section -->
        <div class="chart-container" style="position: relative; margin: 20px; padding: 15px; background: #2d3436; border-radius: 8px;">
            <h3 style="color: white; margin-top: 0; margin-bottom: 15px; font-size: 1.1rem; font-weight: 500;">📅 expenses</h3>
            <canvas id="weeklyExpenseChart" style="max-height: 250px; min-height: 200px;"></canvas>
        </div>

        <!-- Calendar Section -->
        <div class="calendar-area">
            <div class="calendar-header">
                <button class="nav-btn" id="prevMonth">&lt; Prev</button>
                <h3 id="monthYearDisplay">May 2026</h3>
                <button class="nav-btn" id="nextMonth">Next &gt;</button>
            </div>
            <div class="calendar-body">
                <div id='fullDiv'>
                    <ul id="calendarGrid"></ul>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Grid List Modal Component -->
<div class="modal" id="detailsModal">
    <div class="modal-content">
        <span class="close-btn" id="closeModal">&times;</span>
        <h3 id="modalDateTitle">Transactions Summary</h3>
        
        <div class="list-wrapper">
            <div class="table-header" id="modalTableHeader">
                <div>Type / Category</div>
                <div>Description / Memo</div>
                <div style="text-align: right;">Amount</div>
                <div style="text-align: right;">Actions</div>
            </div>
            <div id="modalListContainer"></div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    var transactionDatabase = {};
    var currentDate = new Date();
    var currentSelectedDate = ""; 
    var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    
    // Weekly budget variable
    var WEEKLY_BUDGET = 400.00; 

    var expenseChartInstance = null;

    var categoryColors = {
        'book': '#a29bfe',
        'culture': '#ffeaa7',
        'eat out': '#ff7675',
        'fee': '#fab1a0',
        'fun': '#fd79a8',
        'grocery': '#55efc4',
        'health': '#ffeaa7',
        'luck': '#fdcb6e',
        'necesito': '#74b9ff',
        'utility': '#dfe6e9',
        'transport': '#81ecec',
        'church': '#55efc4',
        'family': '#a29bfe',
        'uncommon expense': '#fd79a8',
        'rent': '#fab1a0',
        'other': '#b2bec3'
    };

    function loadInitialData() {
        $.ajax({
            url: '/api/transactions',
            type: 'GET',
            success: function(data) {
                transactionDatabase = {};
                data.forEach(function(item) {
                    if (!transactionDatabase[item.date]) {
                        transactionDatabase[item.date] = [];
                    }
                    transactionDatabase[item.date].push(item);
                });
                renderCalendar(); 
                updateRemainingBalance();
                updateWeeklyChart();
            }
        });
    }

    function renderCalendar() {
        var year = currentDate.getFullYear();
        var month = currentDate.getMonth();

        $("#monthYearDisplay").text(monthNames[month] + " " + year);
        var $grid = $("#calendarGrid").empty();

        var daysOfWeek = ["SUN", "MON", "TUE", "WED", "THUR", "FRI", "SAT"];
        daysOfWeek.forEach(function(day) {
            $grid.append($("<li>").addClass("day-title").text(day));
        });

        var firstDayIndex = new Date(year, month, 1).getDay();
        var totalDaysCurrent = new Date(year, month + 1, 0).getDate();
        var totalDaysPrev = new Date(year, month, 0).getDate();

        for (var i = firstDayIndex - 1; i >= 0; i--) {
            var prevDay = totalDaysPrev - i;
            var targetMonth = month === 0 ? 11 : month - 1;
            var targetYear = month === 0 ? year - 1 : year;
            appendDayCell($grid, prevDay, formatDateString(targetYear, targetMonth, prevDay), "not-current-month");
        }

        for (var day = 1; day <= totalDaysCurrent; day++) {
            appendDayCell($grid, day, formatDateString(year, month, day), "current-month-day");
        }

        var totalRenderedSoFar = firstDayIndex + totalDaysCurrent;
        var nextMonthPadding = 42 - totalRenderedSoFar;
        for (var day = 1; day <= nextMonthPadding; day++) {
            var targetMonth = month === 11 ? 0 : month + 1;
            var targetYear = month === 11 ? year + 1 : year;
            appendDayCell($grid, day, formatDateString(targetYear, targetMonth, day), "not-current-month");
        }
    }

    function updateRemainingBalance() {
        var totalIncome = 0;
        var totalExpense = 0;

        Object.keys(transactionDatabase).forEach(function(dateKey) {
            transactionDatabase[dateKey].forEach(function(item) {
                if (item.type === 'income') {
                    totalIncome += item.amount;
                } else {
                    totalExpense += item.amount;
                }
            });
        });

        var finalBalance = totalIncome - totalExpense;
        var formattedBalance = Number(finalBalance.toFixed(2)).toLocaleString('en-US', {
            minimumFractionDigits: 2, maximumFractionDigits: 2
        });
        
        if (finalBalance >= 0) {
            $("#totalBalanceDisplay").text("$" + formattedBalance).css("color", "white");
        } else {
            var negativeFormatted = Number(Math.abs(finalBalance).toFixed(2)).toLocaleString('en-US', {
                minimumFractionDigits: 2, maximumFractionDigits: 2
            });
            $("#totalBalanceDisplay").text("-$" + negativeFormatted).css("color", "#ff7675");
        }
    }

    function updateWeeklyChart() {
        var canvas = document.getElementById('weeklyExpenseChart');
        if (!canvas) return; 
        var ctx = canvas.getContext('2d');
        
        var dateKeys = [];
        var firstDateLabel = "";
        var lastDateLabel = "";
        
        for (var i = 13; i >= 0; i--) {
            var d = new Date();
            d.setDate(d.getDate() - i);
            
            var month = d.getMonth() + 1;
            var day = d.getDate();
            var year = d.getFullYear();
            
            var formattedKey = formatDateString(year, d.getMonth(), day); 
            dateKeys.push(formattedKey);

            if (i === 13) firstDateLabel = month + '/' + day;
            if (i === 0) lastDateLabel = month + '/' + day;
        }

        var labels = [firstDateLabel + ' - ' + lastDateLabel];

        var categories = new Set();
        Object.keys(transactionDatabase).forEach(function(dateKey) {
            if (dateKeys.includes(dateKey)) {
                transactionDatabase[dateKey].forEach(function(item) {
                    if (item.type === 'expense') {
                        categories.add(item.category || 'other');
                    }
                });
            }
        });

        var datasets = Array.from(categories).map(function(cat) {
            var totalSum = 0;
            
            dateKeys.forEach(function(dateKey) {
                if (transactionDatabase[dateKey]) {
                    transactionDatabase[dateKey].forEach(function(item) {
                        if (item.type === 'expense' && (item.category || 'other') === cat) {
                            totalSum += item.amount;
                        }
                    });
                }
            });

            return {
                label: cat,
                data: [totalSum], 
                backgroundColor: categoryColors[cat] || categoryColors['other'],
                barPercentage: 0.3 
            };
        });

        if (expenseChartInstance !== null) {
            expenseChartInstance.destroy();
        }

        expenseChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        stacked: true, 
                        grid: { display: false },
                        ticks: { color: '#b2bec3' }
                    },
                    y: {
                        stacked: true, 
                        grid: { color: '#636e72' },
                        ticks: { 
                            color: '#b2bec3',
                            callback: function(value) { return '$' + value; }
                        }
                    }
                },
                plugins: {
                    legend: {
                        position: 'top',
                        labels: { color: 'white', boxWidth: 12 }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': $' + context.raw.toFixed(2);
                            }
                        }
                    },
                    annotation: {
                        annotations: {
                            budgetLine: {
                                type: 'line',
                                yMin: WEEKLY_BUDGET,
                                yMax: WEEKLY_BUDGET,
                                borderColor: '#e74c3c',
                                borderWidth: 2,
                                borderDash: [6, 6],
                                label: {
                                    display: true,
                                    content: 'Budget: $' + WEEKLY_BUDGET,
                                    position: 'end',
                                    backgroundColor: 'rgba(231, 76, 60, 0.8)',
                                    color: 'white',
                                    font: { size: 10, weight: 'bold' }
                                }
                            }
                        }
                    }
                }
            }
        });
    }

    function appendDayCell($parent, displayNum, dateIsoStr, className) {
        var $li = $("<li>").addClass(className).attr("data-date", dateIsoStr);
        $li.append($("<span>").addClass("date-num").text(displayNum));
        
        var $displayDiv = $("<div>").addClass("expense-display");
        
        if (transactionDatabase[dateIsoStr]) {
            var incSum = 0, expSum = 0;
            transactionDatabase[dateIsoStr].forEach(function(item) {
                if (item.type === 'income') incSum += item.amount;
                else expSum += item.amount;
            });

            if (incSum > 0) $displayDiv.append($("<div>").addClass("income-text").text("+" + incSum.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})));
            if (expSum > 0) $displayDiv.append($("<div>").addClass("expense-text").text("-" + expSum.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})));
        }
        
        $li.append($displayDiv);
        $parent.append($li);
    }

    function formatDateString(y, m, d) {
        var mm = (m + 1) < 10 ? "0" + (m + 1) : (m + 1);
        var dd = d < 10 ? "0" + d : d;
        return y + "-" + mm + "-" + dd;
    }

    function loadModalTransactions(dateStr) {
        currentSelectedDate = dateStr;
        $("#modalDateTitle").text("Transactions for " + dateStr);
        
        var $container = $("#modalListContainer").empty();
        var items = transactionDatabase[dateStr] || [];

        if (items.length === 0) {
            $("#modalTableHeader").hide();
            $container.append($("<div>").addClass("no-data").text("No records tracked on this date."));
            return;
        }

        $("#modalTableHeader").show();

        items.forEach(function(item) {
            var isInc = item.type === 'income';
            var sign = isInc ? '+' : '-';
            var colorClass = isInc ? 'income-text' : 'expense-text';
            var badgeClass = isInc ? 'badge-inc' : 'badge-exp';
            
            var $row = $("<div>").addClass("transaction-row").attr("data-id", item.id);

            var $colInfo = $("<div>").append(
                $("<span>").addClass("type-badge " + badgeClass).text(item.type.toUpperCase()),
                $("<div>").addClass("row-cat").text(item.category)
            );

            var $colMemo = $("<div>").addClass("row-memo").text(item.memo || "—");
            var $colAmount = $("<div>").addClass("row-amount " + colorClass).text(sign + "$" + item.amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}));

            var $colActions = $("<div>").addClass("row-actions");
            var $editBtn = $("<button>").addClass("action-btn edit-btn").text("Edit");
            var $deleteBtn = $("<button>").addClass("action-btn delete-btn").text("Delete");
            $colActions.append($editBtn, $deleteBtn);

            $row.append($colInfo, $colMemo, $colAmount, $colActions);
            $container.append($row);

            $editBtn.on("click", function() {
                $colInfo.html(`
                    <select class="edit-input edit-cat">
                        <option value="book" ${item.category==='book'?'selected':''}>book</option>
                        <option value="culture" ${item.category==='culture'?'selected':''}>culture</option>
                        <option value="eat out" ${item.category==='eat out'?'selected':''}>eat out</option>
                        <option value="fee" ${item.category==='fee'?'selected':''}>fee</option>
                        <option value="fun" ${item.category==='fun'?'selected':''}>fun</option>
                        <option value="grocery" ${item.category==='grocery'?'selected':''}>grocery</option>
                        <option value="health" ${item.category==='health'?'selected':''}>health</option>
                        <option value="luck" ${item.category==='luck'?'selected':''}>luck</option>
                        <option value="necesito" ${item.category==='necesito'?'selected':''}>necesito</option>
                        <option value="utility" ${item.category==='utility'?'selected':''}>utility</option>
                        <option value="transport" ${item.category==='transport'?'selected':''}>transport</option>
                        <option value="church" ${item.category==='church'?'selected':''}>church</option>
                        <option value="family" ${item.category==='family'?'selected':''}>family</option>
                        <option value="uncommon expense" ${item.category==='uncommon expense'?'selected':''}>uncommon expense</option>
                        <option value="rent" ${item.category==='rent'?'selected':''}>rent</option>
                        <option value="salary" ${item.category==='salary'?'selected':''}>salary</option>
                        <option value="other income" ${item.category==='other income'?'selected':''}>other income</option>
                        <option value="etc." ${item.category==='etc.'?'selected':''}>etc.</option>
                    </select>
                `);

                $colMemo.html(`<input type="text" class="edit-input edit-mem" value="${item.memo}" />`);
                $colAmount.html(`<input type="number" class="edit-input edit-amt" min="0.01" step="0.01" value="${item.amount}" style="text-align:right;" />`);

                var $saveBtn = $("<button>").addClass("action-btn save-btn").text("Save");
                var $cancelBtn = $("<button>").addClass("action-btn cancel-btn").text("Cancel");
                $colActions.empty().append($saveBtn, $cancelBtn);

                $cancelBtn.on("click", function() {
                    loadModalTransactions(currentSelectedDate);
                });

                $saveBtn.on("click", function() {
                    var selectedCat = $colInfo.find(".edit-cat").val();
                    var autoType = (selectedCat === "salary" || selectedCat === "other income") ? "income" : "expense";

                    var updatedData = {
                        type: autoType,
                        category: selectedCat,
                        memo: $colMemo.find(".edit-mem").val(),
                        amount: parseFloat($colAmount.find(".edit-amt").val()) || 0
                    };

                    $.ajax({
                        url: '/api/transactions/' + item.id,
                        type: 'PUT',
                        contentType: 'application/json',
                        data: JSON.stringify(updatedData),
                        success: function() {
                            item.type = updatedData.type;
                            item.category = updatedData.category;
                            item.memo = updatedData.memo;
                            item.amount = updatedData.amount;
                            loadModalTransactions(currentSelectedDate);
                            renderCalendar();
                            updateRemainingBalance();
                            updateWeeklyChart(); 
                        }
                    });
                });
            });

            $deleteBtn.on("click", function() {
                $.ajax({
                    url: '/api/transactions/' + item.id,
                    type: 'DELETE',
                    success: function() {
                        transactionDatabase[currentSelectedDate] = transactionDatabase[currentSelectedDate].filter(function(el) {
                            return el.id !== item.id;
                        });
                        loadModalTransactions(currentSelectedDate);
                        renderCalendar();
                        updateRemainingBalance();
                        updateWeeklyChart(); 
                    }
                });
            });
        });
    }

    $("#calendarGrid").on("click", "li:not(.day-title)", function() {
        var chosenDateStr = $(this).attr("data-date");
        loadModalTransactions(chosenDateStr);
        $("#detailsModal").css("display", "flex");
    });

    $("#closeModal").on("click", function() { $("#detailsModal").hide(); });
    $(window).on("click", function(e) {
        if ($(e.target).is("#detailsModal")) $("#detailsModal").hide();
    });

    $("#prevMonth").on("click", function() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
    $("#nextMonth").on("click", function() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });

    $("#expenseForm").on("submit", function(e) {
        e.preventDefault();

        var dateVal = $("#expenseDate").val();
        var amountVal = parseFloat($("#expenseAmount").val());
        var categoryVal = $("#expenseCategory").val();
        var memoVal = $("#expenseMemo").val();
        
        var incomeCategories = ["salary", "other income"];
        var typeVal = incomeCategories.includes(categoryVal) ? "income" : "expense";

        if (!dateVal || isNaN(amountVal)) return;

        var newTransaction = {
            id: Date.now() + Math.random().toString(36).substr(2, 9),
            date: dateVal,
            type: typeVal,
            amount: amountVal,
            category: categoryVal,
            memo: memoVal
        };

        $.ajax({
            url: '/api/transactions',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(newTransaction),
            success: function() {
                if (!transactionDatabase[dateVal]) {
                    transactionDatabase[dateVal] = [];
                }
                transactionDatabase[dateVal].push(newTransaction);
                renderCalendar();
                updateRemainingBalance();
                updateWeeklyChart(); 

                $("#expenseAmount").val("");
                $("#expenseCategory").val("");
                $("#expenseMemo").val("");
            }
        });
    });

    loadInitialData();
});
</script>
</body>
</html>
