<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Statistics</title>
    <!-- jQuery & Chart.js 로드 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Helvetica', Arial, sans-serif;
            background-color: #f5f6fa;
            color: #2f3640;
        }
        .stats-container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .header-area h2 {
            margin: 0;
            color: #1abc9c;
        }
        .back-link {
            text-decoration: none;
            color: #7f8c8d;
            font-weight: bold;
            font-size: 14px;
        }
        .back-link:hover { color: #2f3640; }

        .month-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .month-title {
            font-size: 22px;
            font-weight: bold;
            color: #2f3640;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 10px;
        }
        
        .content-layout {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        @media (min-width: 768px) {
            .content-layout {
                flex-direction: row;
            }
            .chart-box { flex: 1.2; }
            .list-box { flex: 1; border-left: 1px solid #edf2f7; padding-left: 25px; }
        }
        
        .chart-wrapper {
            position: relative;
            height: 120px; 
            width: 100%;
            display: flex;
            align-items: center;
        }
        .monthly-cat-table {
            width: 100%;
            border-collapse: collapse;
        }
        .monthly-cat-table th, .monthly-cat-table td {
            text-align: left;
            padding: 10px 6px;
            font-size: 14px;
            border-bottom: 1px solid #edf2f7;
        }
        .monthly-cat-table th {
            color: #7f8c8d;
            font-weight: 600;
        }
        .monthly-cat-table td.amt-col {
            text-align: right;
            font-weight: bold;
            color: #e74c3c;
        }

        .cat-row {
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .cat-row:hover {
            background-color: #f8f9fa;
        }
        .cat-row:hover td {
            color: #1abc9c;
        }
        .detail-container {
            background-color: #f8f9fa;
            border: 1px solid #edf2f7;
            border-radius: 8px;
            padding: 20px;
            margin-top: 25px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .detail-close {
            float: right;
            cursor: pointer;
            color: #7f8c8d;
            font-size: 16px;
        }
        .detail-close:hover {
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="stats-container">
    <div class="header-area">
        <a href="/" class="back-link">&larr; Back to Calendar</a>
        <h2>📅 Overview</h2>
        <div style="width: 110px;"></div>
        <button id="toggleViewBtn" style="padding: 8px 16px; border: none; border-radius: 20px; background: #2f3640; color: white; cursor: pointer; font-weight: bold; transition: 0.2s;">
            Show Last 14 Days
        </button>
    </div>

    <div id="cardsContainer"></div>
</div>

<script>
$(document).ready(function() {
    var transactionDatabase = {};
    var isRollingMode = false; 

    // 시간 및 날짜 계산을 위한 UTC 상수 및 앵커 설정
    var MS_PER_DAY = 24 * 60 * 60 * 1000;
    var anchorUTC = Date.UTC(2026, 0, 30); // 2026-01-30 UTC

    $("#toggleViewBtn").on("click", function() {
        isRollingMode = !isRollingMode;
        if (isRollingMode) {
            $(this).text("Show Paycheck Cycle").css("background", "#1abc9c");
        } else {
            $(this).text("Show Last 14 Days").css("background", "#2f3640");
        }
        renderStats(); 
    });

    var categoryColors = {
        'book': '#a29bfe', 'culture': '#ffeaa7', 'eat out': '#ff7675', 'fee': '#fab1a0',
        'fun': '#fd79a8', 'grocery': '#55efc4', 'health': '#ffeaa7', 'luck': '#fdcb6e',
        'necesito': '#74b9ff', 'fixed cost': '#dfe6e9', 'transport': '#81ecec', 'church': '#55efc4',
        'family': '#a29bfe', 'uncommon expense': '#fd79a8', 'rent': '#fab1a0', 'other': '#b2bec3', 'etc.': '#b2bec3',
        'gens': '#0984e3' // 표에서 나머지를 몰아넣을 그룹 색상
    };

    // 독립적으로 유지할 4가지 카테고리 및 그룹 이름 정의
    var excludedCategories = ['saving', 'rent', 'fixed cost', 'uncommon expense', 'stupid'];
    var GROUP_NAME = 'gens';

    // 표에서 사용할 카테고리 매핑 함수 (4가지를 제외한 나머지는 전부 General Expenses로 반환)
    function getMappedCategory(cat) {
        var c = cat || 'etc.';
        if (excludedCategories.includes(c)) {
            return c;
        }
        return GROUP_NAME;
    }

    // 오늘 날짜의 UTC 00시 00분 00초 밀리초 구하기
    function getTodayUTC() {
        var now = new Date();
        return Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    }

    // "YYYY-MM-DD" 문자열을 UTC 밀리초로 변환
    function parseDateToUTC(dateStr) {
        if (!dateStr) return null;
        var parts = dateStr.split('-');
        return Date.UTC(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    }

    function loadInitialData() {
        $.ajax({
            url: '/api/transactions',
            type: 'GET',
            success: function(data) {
                transactionDatabase = {};
                data.forEach(function(item) {
                    var date = item.date || ""; 
                    if (!transactionDatabase[date]) {
                        transactionDatabase[date] = [];
                    }
                    transactionDatabase[date].push(item);
                });
                renderStats();
            },
            error: function() {
                generateDummyData();
                renderStats();
            }
        });
    }

    function generateDummyData() {
        transactionDatabase = {
            '2026-09-22': [{type: 'expense', category: 'eat out', amount: 45.50, description: 'Lunch'}],
            '2026-09-23': [{type: 'expense', category: 'grocery', amount: 120.00, description: 'Walmart'}],
            '2026-09-25': [{type: 'expense', category: 'necesito', amount: 30.00, description: 'Supplies'}]
        };
    }

    function renderStats() {
        var todayUTC = getTodayUTC();
        var diffDaysToday = Math.floor((todayUTC - anchorUTC) / MS_PER_DAY);
        var currentCycle = Math.floor(diffDaysToday / 14);

        var apiUrl = isRollingMode ? '/api/transactions' : ('/api/transactions/cycle/' + currentCycle);

        $.ajax({
            url: apiUrl,
            type: 'GET',
            success: function(data) {
                processAndRenderStats(data, currentCycle, todayUTC);
            }
        });
    }

    function processAndRenderStats(data, currentCycle, todayUTC) {
        var $container =$("#cardsContainer").empty();

        var periodTitle = "";
        
        if (isRollingMode) {
            var pastMs = todayUTC - (13 * MS_PER_DAY);
            var pastDate = new Date(pastMs);
            var todayDate = new Date(todayUTC);
            periodTitle = "Rolling: " + (pastDate.getUTCMonth() + 1) + "/" + pastDate.getUTCDate() + " - " + 
                          (todayDate.getUTCMonth() + 1) + "/" + todayDate.getUTCDate();
        } else {
            var cycleStartMs = anchorUTC + (currentCycle * 14 * MS_PER_DAY);
            var cycleEndMs = cycleStartMs + (13 * MS_PER_DAY);
            var cycleStart = new Date(cycleStartMs);
            var cycleEnd = new Date(cycleEndMs);
            periodTitle = "Paycheck: " + (cycleStart.getUTCMonth() + 1) + "/" + cycleStart.getUTCDate() + " - " + 
                          (cycleEnd.getUTCMonth() + 1) + "/" + cycleEnd.getUTCDate();
        }

        var rawCategoryTotals = {};   // 💡 차트용 (개별 카테고리 유지)
        var tableCategoryTotals = {}; // 💡 표용 (그룹화 적용)
        var periodTotal = 0; 
        var hasData = false;
        
        data.forEach(function(item) {
            var isValid = false;

            if (isRollingMode) {
                if (item.date) {
                    var itemUTC = parseDateToUTC(item.date);
                    var diffFromToday = Math.floor((todayUTC - itemUTC) / MS_PER_DAY);
                    if (diffFromToday >= 0 && diffFromToday <= 13) isValid = true;
                }
            } else {
                isValid = true;
            }

            if (isValid && item.type === 'expense') {
                var rawCat = item.category || 'etc.';
                
                // 1. 차트용 집계 (개별 카테고리 그대로)
                rawCategoryTotals[rawCat] = (rawCategoryTotals[rawCat] || 0) + item.amount;

                // 2. 표용 집계 (그룹화 적용)
                var tableCat = getMappedCategory(rawCat);
                tableCategoryTotals[tableCat] = (tableCategoryTotals[tableCat] || 0) + item.amount;

                periodTotal += item.amount;
                hasData = true;
            }
        });

        var cardId = "card-current";
        var chartId = "chart-current";
        var listId = "list-current";
        var subListId = "sub-list-current";
        var detailId = "detail-current";

        var cardHtml = `
            <div class="month-card" id="${cardId}" data-cycle="${currentCycle}">
                <div class="month-title">${periodTitle}</div>
                <div class="content-layout">
                    <div class="chart-box">
                        <div class="chart-wrapper">
                            <canvas id="${chartId}"></canvas>
                        </div>
                        <div style="text-align:center; margin-top:10px; font-size:12px; color:#a4b0be;">
                            * Click on a category or chart segment to view details
                        </div>
                    </div>
                    <div class="list-box">
                        <table class="monthly-cat-table">
                            <thead>
                                <tr>
                                    <th>Category (Legend)</th>
                                    <th style="text-align: right;">Amount</th>
                                </tr>
                            </thead>
                            <tbody id="${listId}"></tbody>
                            <tfoot>
                                <tr style="border-top: 2px solid #2f3640;">
                                    <td style="font-weight:bold; color:#2f3640; padding-top:15px; font-size:15px;">Period Total</td>
                                    <td class="amt-col" style="padding-top:15px; font-size:16px;">
                                        $${periodTotal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                                    </td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
                <div id="${detailId}" class="detail-container" style="display:none;"></div>
            </div>
            <!-- 💡 General Expenses 세부 항목(쫌쫌따리)을 보여주는 서브 표 영역 추가 -->
                <div style="margin-top: 30px; border-top: 2px dashed #edf2f7; padding-top: 20px;">
                    <h4 style="margin: 0 0 12px 0; font-size: 15px; color: #7f8c8d; font-weight: 600;">📌 Gens Breakdown (세부 항목)</h4>
                    <table class="monthly-cat-table">
                        <thead>
                            <tr>
                                <th>Sub-Category</th>
                                <th style="text-align: right;">Amount</th>
                            </tr>
                        </thead>
                        <tbody id="${subListId}"></tbody>
                    </table>
                </div>

                <div id="${detailId}" class="detail-container" style="display:none;"></div>
            </div>
        
        `;
        $container.append(cardHtml);

        var $tableBody =$("#" + listId);
        var $subTableBody =$("#" + subListId);
        var chartDatasets = [];

        if (!hasData) {
            $tableBody.append('<tr><td colspan="2" style="text-align:center; color:#7f8c8d; font-style:italic; padding:30px 0;">No expenses tracked for this period.</td></tr>');
        } else {
            // 1. 표(Table)는 그룹화된 tableCategoryTotals 기준으로 렌더링
            var sortedTableCategories = Object.keys(tableCategoryTotals).sort(function(a,b) {
                return tableCategoryTotals[b] - tableCategoryTotals[a];
            });

            sortedTableCategories.forEach(function(cat) {
                var amt = tableCategoryTotals[cat];
                var rowHtml = `<tr class="cat-row" data-cat="${cat}">
                    <td><span style="display:inline-block; width:12px; height:12px; background-color:${categoryColors[cat]||'#b2bec3'}; margin-right:8px; border-radius:2px; vertical-align:middle;"></span>${cat}</td>
                    <td class="amt-col">$${amt.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                </tr>`;
                $tableBody.append(rowHtml);
            });
            var generalSubTotals = {};
            Object.keys(rawCategoryTotals).forEach(function(cat) {
                if (!excludedCategories.includes(cat)) {
                    generalSubTotals[cat] = rawCategoryTotals[cat];
                }
            });

            var sortedGeneralSubs = Object.keys(generalSubTotals).sort(function(a, b) {
                return generalSubTotals[b] - generalSubTotals[a];
            });

            if (sortedGeneralSubs.length === 0) {
                $subTableBody.append('<tr><td colspan="2" style="text-align:center; color:#7f8c8d; font-style:italic; padding:15px 0;">No sub-items in General Expenses.</td></tr>');
            } else {
                sortedGeneralSubs.forEach(function(cat) {
                    var amt = generalSubTotals[cat];
                    var subRowHtml = `<tr class="sub-cat-row" data-cat="${cat}">
                        <td><span style="display:inline-block; width:10px; height:10px; background-color:${categoryColors[cat]||'#b2bec3'}; margin-right:8px; border-radius:2px; vertical-align:middle;"></span>${cat}</td>
                        <td class="amt-col">$${amt.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    </tr>`;
                    $subTableBody.append(subRowHtml);
                });
            }

            // 2. 차트(Chart)는 개별 rawCategoryTotals 기준으로 렌더링
            var sortedChartCategories = Object.keys(rawCategoryTotals).sort(function(a,b) {
                return rawCategoryTotals[b] - rawCategoryTotals[a];
            });

            sortedChartCategories.forEach(function(cat) {
                var amt = rawCategoryTotals[cat];
                chartDatasets.push({
                    label: cat,
                    data: [amt], 
                    backgroundColor: categoryColors[cat] || '#b2bec3',
                    barThickness: 45,
                    borderRadius: 4
                });
            });
        }

        var ctx = document.getElementById(chartId).getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: { labels: [''], datasets: chartDatasets },
            options: {
                indexAxis: 'y', 
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { stacked: true, display: false },
                    y: { stacked: true, display: false }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) { return context.dataset.label + ': $' + context.raw.toFixed(2); }
                        }
                    }
                },
                onClick: function(event, elements) {
                    if (elements.length > 0) {
                        var datasetIndex = elements[0].datasetIndex;
                        var clickedCat = this.data.datasets[datasetIndex].label; // 개별 카테고리 이름
                        showCategoryDetails(currentCycle, clickedCat, detailId);
                    }
                }
            }
        });
    }

    $(document).on('click', '.cat-row', function() {
        var cat = $(this).data('cat'); // 표에서 클릭한 항목 (General Expenses 또는 개별 카테고리)
        var $card =$(this).closest('.month-card');
        var cycleNum = $card.data('cycle'); 
        var detailId = $card.find('.detail-container').attr('id');
        
        showCategoryDetails(cycleNum, cat, detailId);
    });

    // 💡 서브 표의 개별 카테고리 클릭 시 상세 내역 조회
    $(document).on('click', '.sub-cat-row', function() {
        var cat = $(this).data('cat'); // 클릭한 세부 카테고리 이름
        var $card = $(this).closest('.month-card');
        var cycleNum = $card.data('cycle'); 
        var detailId = $card.find('.detail-container').attr('id');
        
        showCategoryDetails(cycleNum, cat, detailId);
    });

    function showCategoryDetails(cycleNum, category, containerId) {
        var apiUrl = isRollingMode ? '/api/transactions' : ('/api/transactions/cycle/' + cycleNum);

        $.ajax({
            url: apiUrl,
            type: 'GET',
            success: function(data) {
                var details = [];
                var todayUTC = getTodayUTC();
                
                data.forEach(function(item) {
                    var isValid = false;

                    if (isRollingMode) {
                        if (item.date) {
                            var itemUTC = parseDateToUTC(item.date);
                            var diffFromToday = Math.floor((todayUTC - itemUTC) / MS_PER_DAY);
                            if (diffFromToday >= 0 && diffFromToday <= 13) isValid = true;
                        }
                    } else {
                        isValid = true;
                    }

                    if (isValid && item.type === 'expense') {
                        var rawCat = item.category || 'etc.';
                        var mappedCat = getMappedCategory(rawCat);

                        var isMatch = false;
                        if (category === GROUP_NAME) {
                            // 표에서 General Expenses를 눌렀을 경우 매핑된 항목들 모두 포함
                            isMatch = (mappedCat === GROUP_NAME);
                        } else {
                            // 개별 카테고리(표나 차트에서 개별 클릭한 경우)
                            isMatch = (rawCat === category);
                        }

                        if (isMatch) {
                            details.push({ date: item.date, data: item });
                        }
                    }
                });

                details.sort(function(a, b) { return a.date.localeCompare(b.date); });

                var color = categoryColors[category] || '#333';
                var html = `
                    <div style="margin-bottom: 15px;">
                        <h3 style="margin:0; font-size:18px; color:${color};">
                            <span style="display:inline-block; width:14px; height:14px; background-color:${color}; margin-right:8px; border-radius:3px;"></span>
                            ${category} Expenses
                            <span class="detail-close" onclick="$('#${containerId}').slideUp()">✖</span>
                        </h3>
                    </div>
                    <table style="width:100%; border-collapse: collapse; font-size:14px;">
                        <thead>
                            <tr style="border-bottom: 2px solid #ddd; text-align:left;">
                                <th style="padding: 8px 5px; color:#7f8c8d;">Date</th>
                                <th style="padding: 8px 5px; color:#7f8c8d;">Category</th>
                                <th style="padding: 8px 5px; color:#7f8c8d;">Description</th>
                                <th style="padding: 8px 5px; text-align:right; color:#7f8c8d;">Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                if (details.length === 0) {
                    html += `<tr><td colspan="4" style="text-align:center; padding:15px; color:#7f8c8d;">No details found.</td></tr>`;
                } else {
                    details.forEach(function(entry) {
                        var desc = entry.data.description || entry.data.memo || '-';
                        var amt = entry.data.amount;
                        var itemCat = entry.data.category || '-'; 
                        html += `
                            <tr style="border-bottom: 1px solid #eee;">
                                <td style="padding: 10px 5px; color:#2f3640;">${entry.date}</td>
                                <td style="padding: 10px 5px; color:#7f8c8d; font-size:12px;">${itemCat}</td>
                                <td style="padding: 10px 5px; color:#2f3640;">${desc}</td>
                                <td style="padding: 10px 5px; text-align:right; font-weight:bold; color:#e74c3c;">$${amt.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                            </tr>
                        `;
                    });
                }
                
                html += `</tbody></table>`;
                $("#" + containerId).html(html).slideDown();
            }
        });
    }

    loadInitialData();
});
</script>
</body>
</html>
