<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Yearly Expense Statistics</title>
    <!-- jQuery & Chart.js 로드 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Helvetica', Arial, sans-serif;
            background-color: #f5f6fa;
            color: #2f3640;
        }
        .stats-container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .header-area h2 {
            margin: 0;
            color: #1abc9c;
        }
        .back-link {
            text-decoration: none;
            color: #7f8c8d;
            font-weight: bold;
            font-size: 14px;
        }
        .back-link:hover { color: #2f3640; }

        /* 월별 카드 스타일 */
        .month-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .month-title {
            font-size: 22px;
            font-weight: bold;
            color: #2f3640;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 10px;
        }
        
        .content-layout {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        @media (min-width: 768px) {
            .content-layout {
                flex-direction: row;
            }
            .chart-box { flex: 1.5; }
            .list-box { flex: 1; border-left: 1px solid #edf2f7; padding-left: 25px; }
        }
        
        .chart-wrapper {
            position: relative;
            height: 250px;
            width: 100%;
        }
        
        /* 월별 총액 누적 가로막대 영역 스타일 */
        .total-bar-wrapper {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #edf2f7;
        }
        .total-bar-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2f3640;
        }
        .total-bar-canvas-container {
            position: relative;
            height: 50px;
            width: 100%;
        }

        .monthly-cat-table {
            width: 100%;
            border-collapse: collapse;
        }
        .monthly-cat-table th, .monthly-cat-table td {
            text-align: left;
            padding: 10px 6px;
            font-size: 14px;
            border-bottom: 1px solid #edf2f7;
        }
        .monthly-cat-table th {
            color: #7f8c8d;
            font-weight: 600;
        }
        .monthly-cat-table td.amt-col {
            text-align: right;
            font-weight: bold;
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="stats-container">
    <div class="header-area">
        <a href="/" class="back-link">&larr; Back to Calendar</a>
        <h2>📅 2026 Yearly Overview</h2>
        <div style="width: 110px;"></div> <!-- 밸런스 맞춤용 여백 -->
    </div>

    <!-- 1월부터 12월까지 카드가 동적으로 생성될 공간 -->
    <div id="yearlyCardsContainer"></div>
</div>

<script>
$(document).ready(function() {
    var transactionDatabase = {};
    // 고정된 올해 연도 (2026년 기준)
    var currentYear = 2026; 
    var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    var categoryColors = {
        'book': '#a29bfe', 'culture': '#ffeaa7', 'eat out': '#ff7675', 'fee': '#fab1a0',
        'fun': '#fd79a8', 'grocery': '#55efc4', 'health': '#ffeaa7', 'luck': '#fdcb6e',
        'necesito': '#74b9ff', 'utility': '#dfe6e9', 'transport': '#81ecec', 'church': '#55efc4',
        'family': '#a29bfe', 'uncommon expense': '#fd79a8', 'rent': '#fab1a0', 'other': '#b2bec3', 'etc.': '#b2bec3'
    };

    function loadInitialData() {
        $.ajax({
            url: '/api/transactions',
            type: 'GET',
            success: function(data) {
                transactionDatabase = {};
                data.forEach(function(item) {
                    if (!transactionDatabase[item.date]) {
                        transactionDatabase[item.date] = [];
                    }
                    transactionDatabase[item.date].push(item);
                });
                renderYearlyStats();
            }
        });
    }

    function renderYearlyStats() {
        var $container = $("#yearlyCardsContainer").empty();

        // 1월(0)부터 12월(11)까지 반복하며 카드 생성
        for (var m = 0; m < 12; m++) {
            var monthNum = m + 1;
            var prefix = currentYear + "-" + (monthNum < 10 ? "0" + monthNum : monthNum);
            
            var categoryTotals = {};
            var hasData = false;
            var grandTotal = 0;

            // 해당 월의 데이터 필터링 및 합산
            Object.keys(transactionDatabase).forEach(function(dateKey) {
                if (dateKey.indexOf(prefix) === 0) {
                    transactionDatabase[dateKey].forEach(function(item) {
                        if (item.type === 'expense') {
                            var cat = item.category || 'etc.';
                            categoryTotals[cat] = (categoryTotals[cat] || 0) + item.amount;
                            grandTotal += item.amount;
                            hasData = true;
                        }
                    });
                }
            });

            // 월별 카드 UI 뼈대 만들기
            var cardId = "month-card-" + monthNum;
            var chartId = "chart-" + monthNum;
            var horizontalChartId = "h-chart-" + monthNum;
            var totalAmtId = "total-amt-" + monthNum;
            var listId = "list-" + monthNum;

            var cardHtml = `
                <div class="month-card" id="${cardId}">
                    <div class="month-title">${monthNames[m]} ${currentYear}</div>
                    <div class="content-layout">
                        <!-- 그래프 영역 -->
                        <div class="chart-box">
                            <div class="chart-wrapper">
                                <canvas id="${chartId}"></canvas>
                            </div>
                            <!-- 월별 총액 누적 가로막대 영역 -->
                            <div class="total-bar-wrapper">
                                <div class="total-bar-info">
                                    <span>Total Expense</span>
                                    <span id="${totalAmtId}">$0.00</span>
                                </div>
                                <div class="total-bar-canvas-container">
                                    <canvas id="${horizontalChartId}"></canvas>
                                </div>
                            </div>
                        </div>
                        <!-- 리스트 영역 -->
                        <div class="list-box">
                            <table class="monthly-cat-table">
                                <thead>
                                    <tr>
                                        <th>Category</th>
                                        <th style="text-align: right;">Total Amount</th>
                                    </tr>
                                </thead>
                                <tbody id="${listId}">
                                    <!-- 데이터 유무에 따라 동적 삽입 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            $container.append(cardHtml);

            var $tableBody = $("#" + listId);
            var labels = [];
            var dataValues = [];
            var bgColors = [];

            if (!hasData) {
                $tableBody.append('<tr><td colspan="2" style="text-align:center; color:#7f8c8d; font-style:italic; padding:30px 0;">No expenses tracked.</td></tr>');
                $("#" + totalAmtId).text("$0.00");
            } else {
                // 금액이 높은 순으로 정렬
                var sortedCategories = Object.keys(categoryTotals).sort(function(a,b) {
                    return categoryTotals[b] - categoryTotals[a];
                });

                sortedCategories.forEach(function(cat) {
                    var amt = categoryTotals[cat];
                    labels.push(cat);
                    dataValues.push(amt);
                    bgColors.push(categoryColors[cat] || '#b2bec3');

                    var rowHtml = `<tr>
                        <td><span style="display:inline-block; width:12px; height:12px; background-color:${categoryColors[cat]||'#b2bec3'}; margin-right:8px; border-radius:2px; vertical-align:middle;"></span>${cat}</td>
                        <td class="amt-col">$${amt.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    </tr>`;
                    $tableBody.append(rowHtml);
                });

                // 총액 텍스트 업데이트
                $("#" + totalAmtId).text('$' + grandTotal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}));
            }

            // 1. 개별 세로 막대그래프 생성
            var ctx = document.getElementById(chartId).getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Expenses ($)',
                        data: dataValues,
                        backgroundColor: bgColors,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { grid: { display: false } },
                        y: {
                            beginAtZero: true,
                            ticks: { callback: function(value) { return '$' + value; } }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) { return context.label + ': $' + context.raw.toFixed(2); }
                            }
                        }
                    }
                }
            });

            // 2. 카테고리별 비중을 보여주는 누적 가로막대그래프 생성
            var hCtx = document.getElementById(horizontalChartId).getContext('2d');
            
            // 누적 가로막대를 위해 데이터셋 구성 (각 카테고리를 하나의 데이터셋으로 분리하여 가로로 누적)
            var horizontalDatasets = [];
            if (hasData) {
                sortedCategories.forEach(function(cat) {
                    var amt = categoryTotals[cat];
                    horizontalDatasets.push({
                        label: cat,
                        data: [amt],
                        backgroundColor: categoryColors[cat] || '#b2bec3',
                        barThickness: 16
                    });
                });
            } else {
                horizontalDatasets.push({
                    label: 'No Data',
                    data: [0],
                    backgroundColor: '#dfe6e9',
                    barThickness: 16
                });
            }

            new Chart(hCtx, {
                type: 'bar',
                data: {
                    labels: ['Total'],
                    datasets: horizontalDatasets
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            stacked: true,
                            display: false,
                            beginAtZero: true
                        },
                        y: {
                            stacked: true,
                            display: false
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if (!hasData) return 'No expenses';
                                    return context.dataset.label + ': $' + context.raw.toFixed(2);
                                }
                            }
                        }
                    }
                }
            });
        }
    }

    loadInitialData();
});
</script>
</body>
</html>
